services:

  web:
    image: zeckson.com:3
    container_name: zeckson-com
    build: .
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Path-based routing
      - "traefik.http.routers.web.rule=Host(`zeckson.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=le"

networks:
  proxy:
    name: fornex-cloudflare
    external: true

